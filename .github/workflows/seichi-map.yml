name: seichi-map
on:
  push:
    paths: ['seichi-map/**']
  pull_request:
    paths: ['seichi-map/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node seichi-map/scripts/validate.mjs
      - run: node --check seichi-map/js/app.js
