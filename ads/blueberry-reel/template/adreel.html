<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ad Reel Template</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-jp/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-jp/900.css">
<link rel="stylesheet" href="ad.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  #stage { width: 1080px; height: 1920px; }
  #sky { transform-origin: 50% 0; }
  .acontent > * { will-change: transform, opacity; }
  .acontent.scene { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div><div id="forest"></div>
  <div id="scenes" class="layer"></div>
  <div id="guides" class="layer">
    <div class="g" style="top:0;height:269px"></div>
    <div class="g" style="bottom:0;height:672px"></div>
    <div class="gs" style="left:0;width:64px"></div>
    <div class="gs" style="right:0;width:64px"></div>
  </div>
</div>
<script src="lib.js"></script>
<script src="ad.js"></script>
<script src="adreel.js"></script>
</body>
</html>
