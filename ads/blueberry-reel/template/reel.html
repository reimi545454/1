<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Reel Template</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 1080px; height: 1920px; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .abs { position: absolute; }
  .center-x { left: 50%; transform: translateX(-50%); }
  .headline { position: absolute; left: 70px; right: 70px; text-align: center; }
  .ln { display: block; overflow: hidden; padding: 6px 0 14px; }
  .ln .in { display: inline-block; will-change: transform; white-space: nowrap; }
  .h-xl { font-size: 112px; font-weight: 900; line-height: 1.12; }
  .h-l  { font-size: 92px;  font-weight: 900; line-height: 1.16; }
  .h-m  { font-size: 76px;  font-weight: 900; line-height: 1.2; }
  .headline .hl { background-size: 0% 100%; }
  .kicker { font-size: 40px; }
  .tag { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 38px; padding: 12px 30px; border-radius: 14px; white-space: nowrap; color: #fff; }
  .note { left: 0; right: 0; text-align: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 42px; color: var(--green-deep); }
  .pcard { left: 80px; right: 80px; height: 200px; display: flex; align-items: center; gap: 36px; padding: 0 44px; }
  .pcard .ic { flex: 0 0 132px; height: 132px; border-radius: 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
  .pcard .tx { font-size: 56px; font-weight: 900; line-height: 1.22; }
  .pcard .num { position: absolute; top: -22px; left: 36px; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 30px; background: var(--green-deep); color: #fff; padding: 6px 22px; border-radius: 999px; letter-spacing: 0.06em; }
  .stat { left: 80px; right: 80px; height: 210px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
  .stat .lb { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 44px; color: var(--green-deep); line-height: 1.3; }
  .stat .val { font-weight: 900; color: var(--berry); white-space: nowrap; }
  .stat .val b { font-size: 150px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .val span { font-size: 58px; margin-left: 8px; }
  .gcard { width: 440px; height: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .gcard .gl { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 46px; color: #3a2a1c; white-space: nowrap; }
  .or { width: 130px; height: 130px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 36px; box-shadow: 0 10px 24px rgba(160,20,10,0.3); }
  .btn { left: 50%; width: 880px; height: 176px; margin-left: -440px; font-size: 68px; }
  .btn .arrow { width: 70px; height: 70px; }
  .disc { left: 80px; right: 80px; font-size: 26px; }
  .brand { left: 0; right: 0; top: 285px; text-align: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: 0.14em; color: var(--green-deep); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer bg-cream"></div>
  <svg id="particles" class="layer" width="1080" height="1920"></svg>
  <svg id="hills" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="scenes" class="layer"></div>
  <div id="guides" class="layer">
    <div class="g" style="top:0;height:269px"></div>
    <div class="g" style="bottom:0;height:672px"></div>
    <div class="gs" style="left:0;width:64px"></div>
    <div class="gs" style="right:0;width:64px"></div>
  </div>
</div>
<script src="lib.js"></script>
<script src="reel.js"></script>
</body>
</html>
