<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Static Template</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; }
  #content { position: absolute; left: 0; width: 1080px; transform-origin: top center; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 0 70px; }
  .row { display: flex; gap: 20px; width: 100%; justify-content: center; }
  .kicker { font-size: 38px; }
  .hd { text-align: center; font-weight: 900; line-height: 1.16; font-size: 96px; }
  .hd.m { font-size: 80px; } .hd.s { font-size: 66px; }
  .hd .ln { display: block; white-space: nowrap; }
  .sub { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 40px; color: var(--green-deep); text-align: center; line-height: 1.4; }
  .ph { width: 100%; height: 340px; position: relative; }
  .ph .tag { position: absolute; left: 24px; top: -18px; background: var(--green); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 32px; padding: 8px 24px; border-radius: 12px; white-space: nowrap; }
  .chip { flex: 1; background: #fff; border-radius: 26px; padding: 20px 10px; text-align: center; font-weight: 900; font-size: 36px; line-height: 1.25; box-shadow: 0 10px 24px rgba(28,61,46,.12); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tile { flex: 1; background: #fff; border-radius: 28px; padding: 22px 8px 18px; text-align: center; box-shadow: 0 10px 24px rgba(28,61,46,.12); }
  .tile .lb { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 30px; color: var(--green-deep); }
  .tile .v { font-weight: 900; color: var(--berry); font-size: 116px; line-height: 1.05; white-space: nowrap; }
  .tile .v span { font-size: 44px; margin-left: 4px; }
  .gift { flex: 1; background: #fff; border-radius: 28px; padding: 16px 8px; text-align: center; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 40px; color: #3a2a1c; box-shadow: 0 10px 24px rgba(28,61,46,.12); display: flex; flex-direction: column; align-items: center; }
  .or { align-self: center; flex: 0 0 96px; width: 96px; height: 96px; border-radius: 50%; background: var(--red); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 32px; display: flex; align-items: center; justify-content: center; }
  .cta-btn { width: 900px; height: 150px; font-size: 62px; }
  .cta-btn .arrow { width: 62px; height: 62px; }
  .disclaimer { font-size: 24px; }
  .pain-red { color: var(--red); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer bg-cream" id="bg"></div>
  <svg id="deco" class="layer"></svg>
  <div id="content"></div>
  <div id="guides" class="layer"></div>
</div>
<script src="lib.js"></script>
<script src="static.js"></script>
</body>
</html>
