<!doctype html>
<html lang="ja" data-mascot="apple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ee">
  <title>あおもりカードメーカー</title>
  <meta name="description" content="写真をアップするだけで、青森を盛り上げる人のカードが生成できるWebアプリ。ランダムでレア度が決まるガチャ形式。">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <link rel="icon" href="assets/apple.svg" type="image/svg+xml" id="favicon">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 青森県マーク(各所で <use> 再利用。公式ロゴに差し替えるなら assets/mark.svg とここを入れ替え) -->

  <path d="M60 34C60 27 62 19 68 12" fill="none" stroke="#7a4a2b" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 24C69 9 88 8 95 14C89 27 75 30 64 24Z" fill="#4caf6a"/>
  <path d="M30 50C32 40 38 36 44 35" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
  <circle cx="46" cy="64" r="4.2" fill="#3b1d1d"/>
  <circle cx="74" cy="64" r="4.2" fill="#3b1d1d"/>
  <ellipse cx="38" cy="73" rx="7" ry="4.5" fill="#ff9fb0"/>
  <ellipse cx="82" cy="73" rx="7" ry="4.5" fill="#ff9fb0"/>
  <path d="M53 74Q60 82 67 74" fill="none" stroke="#3b1d1d" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="mark" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="59" fill="#0f5fb0"/>
  <circle cx="60" cy="60" r="55" fill="#fff"/>
  <circle cx="60" cy="60" r="51" fill="#1e88e5"/>
  <path d="M37.7 32.6C38.7 31.6 41.6 29.2 42.7 29.8C43.8 30.3 46.0 35.0 46.3 37.0C46.7 38.9 45.2 43.6 45.6 45.6C46.0 47.6 47.9 51.5 49.2 52.8C50.6 54.1 54.6 55.5 56.4 55.7C58.2 55.9 62.3 55.0 63.6 54.2C64.9 53.5 66.5 51.5 66.5 49.9C66.5 48.3 63.8 43.4 63.6 41.3C63.4 39.1 64.0 34.3 65.0 32.6C66.1 31.0 70.4 28.5 72.2 28.3C74.0 28.1 77.8 31.0 79.4 31.2C81.1 31.4 84.3 29.0 85.2 29.8C86.1 30.5 87.2 35.5 86.6 37.0C86.1 38.4 82.1 39.8 80.9 41.3C79.6 42.7 76.6 46.3 76.6 48.5C76.6 50.6 79.4 56.2 80.9 58.6C82.3 60.9 87.5 64.9 88.1 67.2C88.6 69.5 86.8 74.8 85.2 77.3C83.6 79.8 78.0 85.6 75.1 87.4C72.2 89.2 65.6 91.7 62.2 91.7C58.7 91.7 50.6 89.2 47.8 87.4C44.9 85.6 40.9 79.8 39.1 77.3C37.3 74.8 34.3 69.9 33.4 67.2C32.5 64.5 31.9 58.4 31.9 55.7C31.9 53.0 33.0 47.8 33.4 45.6C33.7 43.4 34.3 40.0 34.8 38.4C35.3 36.8 36.7 33.7 37.7 32.6Z" fill="#fff"/>
  </symbol>
</svg>

<!-- オープニング: くるくるりんご → ぐわっと広がって本編へ -->
<div id="splash" role="status" aria-label="読み込み中">
  <div class="splash-stage">
    <svg class="splash-apple" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark" data-mascot/></svg>
  </div>
  <p class="splash-title">あおもり カードメーカー</p>
  <button type="button" class="splash-skip" id="splashSkip">スキップ</button>
</div>

<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark" data-mascot/></svg>
    <div>
      <h1>あおもりカードメーカー</h1>
      <p class="sub">写真1枚で、あなたも青森のカードに。</p>
    </div>
  </header>

  <main class="layout">
    <!-- 左(スマホでは上): ライブプレビュー -->
    <section class="stage" aria-label="カードのプレビュー">
      <div class="card-frame">
        <canvas id="preview" width="770" height="1274" tabindex="0"
                aria-label="カードのプレビュー。写真は矢印キーで移動、プラスとマイナスで拡大縮小できます"></canvas>
      </div>
      <p class="hint" id="hint">写真を追加すると、ここにカードが出来上がっていくよ</p>
    </section>

    <!-- 右(スマホでは下): 操作パネル -->
    <section class="panel" aria-label="カードの設定">
      <div class="step-block" id="frameBlock" data-step>
        <h2><span class="num">1</span>フレームをえらぶ</h2>
        <div id="frames" class="chips" role="radiogroup" aria-label="フレーム"></div>
      </div>

      <div class="step-block" id="photoBlock" data-step>
        <h2><span class="num">2</span>写真をいれる</h2>
        <button type="button" class="btn-upload" id="btnPick">
          <span class="up-ico" aria-hidden="true">📷</span>
          <span class="up-text"><b>写真をアップロード</b><small>アルバムから選ぶ</small></span>
        </button>
        <button type="button" class="btn btn-camera btn-wide" id="btnCamera">
          <span class="ico" aria-hidden="true">📸</span>カメラでその場でとる
        </button>
        <input type="file" id="fileInput" accept="image/*" hidden>
        <input type="file" id="captureInput" accept="image/*" capture="user" hidden>
        <div class="zoom-row" id="zoomRow" hidden>
          <label for="zoom">ズーム</label>
          <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
          <button type="button" class="btn-mini" id="btnResetView">リセット</button>
        </div>
        <p class="note">ドラッグで位置、ピンチ/スライダーで大きさを調整できるよ。写真はこの端末の中だけで処理されて、サーバーには送信されません。</p>
      </div>

      <div class="step-block" id="nameBlock" data-step>
        <h2><span class="num">3</span><span id="nameTitle">おなまえ</span></h2>
        <div class="name-grid">
          <div>
            <label for="nameLast">苗字 (SURNAME)</label>
            <input type="text" id="nameLast" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AOMORI">
          </div>
          <div>
            <label for="nameFirst">名前 (GIVEN NAME)</label>
            <input type="text" id="nameFirst" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TARO">
          </div>
        </div>
        <p class="name-msg" id="nameMsg" aria-live="polite">ローマ字で入力(ひらがなでもOK。自動でローマ字になります)</p>
        <p class="note">カードには金色の文字で「名前 / 苗字」の順に入ります。</p>
        <div class="slogan-field" id="regionField">
          <label for="region">地域(右下のバッジに入るよ)</label>
          <select id="region"><option value="">青森県(全体)</option></select>
        </div>
      </div>

      <div class="step-block gacha-block" id="makeBlock" data-step>
        <h2><span class="num">4</span>カードをつくる</h2>
        <button type="button" class="btn-gacha" id="btnGenerate" disabled>
          <svg class="gacha-apple" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark" data-mascot/></svg>
          <span class="gacha-label">カードをつくる!</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>© あおもりカードメーカー(ラフ版)</p>
  </footer>
</div>

<!-- カメラ撮影 -->
<div id="camera" class="overlay" role="dialog" aria-modal="true" aria-label="カメラで撮影" hidden>
  <div class="cam-box">
    <div class="cam-view">
      <video id="camVideo" playsinline muted></video>
      <div class="cam-guide" aria-hidden="true"></div>
    </div>
    <div class="cam-bar">
      <button type="button" class="btn-round" id="camClose" aria-label="閉じる">✕</button>
      <button type="button" class="shutter" id="camShutter" aria-label="撮影する"></button>
      <button type="button" class="btn-round" id="camFlip" aria-label="インカメラ/アウトカメラを切り替える">🔄</button>
    </div>
  </div>
</div>

<!-- ガチャ演出 -->
<div id="gacha" class="overlay gacha" aria-live="assertive" hidden>
  <div class="gacha-center">
    <svg class="capsule" viewBox="0 0 120 120" aria-hidden="true"><use href="#mark" data-mascot/></svg>
    <p class="gacha-text" id="gachaText">ガチャッ…</p>
    <p class="gacha-rank" id="gachaRank"></p>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</div>

<!-- 結果 -->
<div id="result" class="overlay result" role="dialog" aria-modal="true" aria-label="できあがったカード" hidden>
  <div class="result-inner">
    <p class="result-rank" id="resultRank"></p>
    <div class="tilt" id="tilt">
      <img id="resultImg" alt="">
      <div class="shine" aria-hidden="true"></div>
    </div>
    <div class="btn-row result-actions">
      <button type="button" class="btn btn-photo" id="btnSave"><span class="ico" aria-hidden="true">💾</span>保存する</button>
      <button type="button" class="btn btn-camera" id="btnShare" hidden><span class="ico" aria-hidden="true">📤</span>シェア</button>
    </div>
    <div class="btn-row result-actions">
      <button type="button" class="btn btn-ghost" id="btnAgain"><span class="ico" aria-hidden="true">🎲</span>もういっかいひく</button>
      <button type="button" class="btn btn-ghost" id="btnBack"><span class="ico" aria-hidden="true">↩️</span>もどる</button>
    </div>
    <p class="note center">画像を長押しでも保存できます</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/lib.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
