<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://cyberjapandata.gsi.go.jp https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>聖地巡礼マップ Japan</title>
<meta name="description" content="日本国内のアニメ・漫画・映画・ドラマの聖地を地図で探せる巡礼マップ。訪問済みの記録にも対応。">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="panel" id="panel" aria-label="スポット一覧と絞り込み">
    <header class="panel__head">
      <h1>聖地巡礼マップ <small>Japan</small></h1>
      <button type="button" class="panel__toggle" id="panelToggle" aria-expanded="true" aria-controls="panelBody">一覧</button>
    </header>
    <div class="panel__body" id="panelBody">
      <div class="filters">
        <label class="sr-only" for="q">キーワード検索</label>
        <input id="q" type="search" placeholder="作品名・場所名で検索" autocomplete="off">
        <div class="filters__row">
          <label class="sr-only" for="category">ジャンル</label>
          <select id="category"><option value="">すべてのジャンル</option></select>
          <label class="sr-only" for="prefecture">都道府県</label>
          <select id="prefecture"><option value="">すべての都道府県</option></select>
        </div>
        <div class="filters__row">
          <label class="sr-only" for="visited">訪問状況</label>
          <select id="visited">
            <option value="">訪問状況: すべて</option>
            <option value="no">未訪問のみ</option>
            <option value="yes">訪問済みのみ</option>
          </select>
          <button type="button" id="locate">現在地周辺</button>
        </div>
      </div>
      <p class="summary" id="summary" role="status" aria-live="polite"></p>
      <ul class="list" id="list"></ul>
      <footer class="panel__foot">
        <p>聖地は私有地・居住地・信仰の場であることが多く、静かに、迷惑をかけない鑑賞を心がけてください。座標は概算です。訪問前に最新情報をご確認ください。</p>
        <p>地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a> / © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></p>
      </footer>
    </div>
  </aside>
  <main id="map" aria-label="地図"></main>
</div>
<noscript><p class="noscript">この地図の表示には JavaScript が必要です。</p></noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="js/app.js"></script>
</body>
</html>
