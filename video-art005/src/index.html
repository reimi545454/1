<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ART-005 X video</title>
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-jp/700.css">
<style>
  :root {
    --ivory: #fff8ee;
    --ivory-band: rgba(255, 249, 238, 0.9);
    --charcoal: #33292a;
    --charcoal-soft: #5b4a45;
    --orange: #f26a1b;
    --orange-deep: #d94f0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fbe9d8; }
  body { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; color: var(--charcoal); }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .plain-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 560px at 18% 12%, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 70%),
      radial-gradient(800px 520px at 88% 92%, rgba(255, 190, 130, .35), rgba(255, 190, 130, 0) 70%),
      linear-gradient(160deg, #fffaf2, #fbe7d4);
  }
  .layer { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .layer img.full { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: contain; display: block; }

  /* 字幕帯：下余白150px（帯の下端 y=930）。最大2行の主字幕＋補助字幕 */
  .band {
    position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%);
    background: var(--ivory-band); color: var(--charcoal);
    border-radius: 28px; padding: 20px 56px; text-align: center;
    box-shadow: 0 10px 36px rgba(160, 80, 20, .16);
    white-space: nowrap; opacity: 0;
  }
  .band .main { font-weight: 700; font-size: 56px; line-height: 1.26; letter-spacing: .02em; }
  .band .main .line { display: block; }
  .band .main .arrow { color: var(--orange-deep); }
  .band .sub { font-weight: 500; font-size: 38px; line-height: 1.4; color: #3f322f; margin-top: 4px; }
  .band.q { padding: 20px 64px; }
  .band.q .main { font-size: 58px; }

  .band.swap { display: grid; }
  .band.swap .main { grid-area: 1 / 1; align-self: center; opacity: 0; }
  .pill {
    position: absolute; transform: translate(-50%, -50%);
    height: 68px; padding: 0 20px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 36px; letter-spacing: .02em; white-space: nowrap;
    background: var(--ivory-band); color: var(--charcoal);
    border: 3px solid var(--orange); border-radius: 999px;
    box-shadow: 0 6px 20px rgba(160, 80, 20, .18); opacity: 0;
  }
  .pill.strong { background: var(--orange-deep); border-color: var(--orange-deep); color: #fff; }
  .num {
    position: absolute; transform: translate(-50%, -50%);
    width: 96px; height: 96px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--ivory-band); border: 5px solid var(--orange);
    font-weight: 700; font-size: 52px; color: var(--orange-deep);
    box-shadow: 0 8px 24px rgba(160, 80, 20, .2); opacity: 0;
  }

  /* シーン3 */
  .s3-title { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; top: 112px; text-align: center; font-weight: 700; font-size: 84px; line-height: 1.2; letter-spacing: .01em; opacity: 0; }
  .s3-sub { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; top: 236px; text-align: center; font-weight: 500; font-size: 40px; line-height: 1.4; color: var(--charcoal-soft); opacity: 0; }
  .s3-img { position: absolute; left: 480px; top: 380px; width: 960px; height: 540px; border-radius: 32px; overflow: hidden; box-shadow: 0 28px 60px rgba(200, 100, 30, .25); transform-origin: 50% 50%; }
  .s3-img img { width: 100%; height: 100%; display: block; object-fit: cover; }

  /* シーン7：バナー全体表示（1200x683 → 1000x569） */
  .s7-banner { position: absolute; left: 460px; top: 100px; width: 1000px; height: 569px; overflow: hidden; box-shadow: 0 28px 60px rgba(200, 80, 20, .28); transform-origin: 50% 50%; }
  .s7-banner img { width: 100%; height: 100%; display: block; object-fit: contain; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="/src/main.mjs"></script>
</body>
</html>
